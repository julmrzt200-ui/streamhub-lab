name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Debug APK (${{ matrix.layout }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Universal keeps phone and TV support in one APK; mobile/tv validate their manifests.
        layout: [ universal, mobile, tv ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
        run: |
          {
            echo "APP_LAYOUT=${{ matrix.layout }}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "SUBDL_API_KEY=${SUBDL_API_KEY}"
            echo "RABBITSTREAM_SOURCE_API=${RABBITSTREAM_SOURCE_API}"
          } > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        shell: bash
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      - name: Build debug APK
        shell: bash
        run: set -o pipefail; ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Prepare APK with versioned name
        shell: bash
        run: |
          mkdir -p release-apks
          VERSION=$(grep 'versionName' app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "release-apks/streamhub-${VERSION}-${{ matrix.layout }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-apk-${{ matrix.layout }}
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-diagnostics-${{ matrix.layout }}
          path: |
            gradle-test.log
            gradle-build.log
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: streamhub-apk-*
          path: apks
          merge-multiple: true

      - name: Read version
        id: get_version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: StreamHub ${{ steps.get_version.outputs.version }}
          body: |
            ## Actualización automática de StreamHub (${{ steps.get_version.outputs.version }})

            ### Archivos disponibles para instalación:
            - **Universal (Móvil y TV):** `streamhub-${{ steps.get_version.outputs.version }}-universal.apk` (Recomendado)
            - **Móvil:** `streamhub-${{ steps.get_version.outputs.version }}-mobile.apk`
            - **Android TV / Fire TV:** `streamhub-${{ steps.get_version.outputs.version }}-tv.apk`

            *Actualizable directamente desde la aplicación mediante el actualizador integrado.*
          draft: false
          prerelease: false
          make_latest: true
          files: apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
