name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK (${{ matrix.layout }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "universal" = original default build (mobile + TV in one APK); the others are layout-specific.
        layout: [ universal, mobile, tv ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build reads local.properties (it is git-ignored). API keys are OPTIONAL for a debug build:
      # without them the related features (TMDb metadata, SubDL, Rabbitstream) simply stay unconfigured.
      - name: Create local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
        run: |
          {
            echo "APP_LAYOUT=${{ matrix.layout }}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "SUBDL_API_KEY=${SUBDL_API_KEY}"
            echo "RABBITSTREAM_SOURCE_API=${RABBITSTREAM_SOURCE_API}"
          } > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        if: matrix.layout == 'universal'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-debug-${{ matrix.layout }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always() && matrix.layout == 'universal'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
