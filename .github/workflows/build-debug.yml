name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK (${{ matrix.layout }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Universal keeps phone and TV support in one APK; mobile/tv validate their manifests.
        layout: [ universal, mobile, tv ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools,platforms;android-36,build-tools;36.0.0"

      - name: Create local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
        run: |
          {
            echo "APP_LAYOUT=${{ matrix.layout }}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "SUBDL_API_KEY=${SUBDL_API_KEY}"
            echo "RABBITSTREAM_SOURCE_API=${RABBITSTREAM_SOURCE_API}"
          } > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        shell: bash
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      - name: Build debug APK
        shell: bash
        run: set -o pipefail; ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-debug-${{ matrix.layout }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-diagnostics-${{ matrix.layout }}
          path: |
            gradle-test.log
            gradle-build.log
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
