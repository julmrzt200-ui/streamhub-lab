name: Build StreamHub APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Download Android packaging tools
        run: |
          mkdir -p tools
          curl --fail --location --silent --show-error \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            --output tools/apktool.jar || \
          curl --fail --location --silent --show-error \
            https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_3.0.3.jar \
            --output tools/apktool.jar
          curl --fail --location --silent --show-error \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar \
            --output tools/uber-apk-signer.jar
          test -s tools/apktool.jar
          test -s tools/uber-apk-signer.jar

      - name: Build APK from project sources
        run: java -jar tools/apktool.jar b . -o app-unsigned.apk

      - name: Align, sign, and verify APK
        shell: bash
        run: |
          java -jar tools/uber-apk-signer.jar -a app-unsigned.apk -o out

          mapfile -t signed_apks < <(find out -type f -name '*.apk' ! -name '*unsigned*' | sort)
          if [[ ${#signed_apks[@]} -ne 1 ]]; then
            echo "Expected exactly one signed APK, found ${#signed_apks[@]}"
            find out -maxdepth 2 -type f -print
            exit 1
          fi

          APKTOOL_VERSION=$(sed -n 's/^  versionName: *//p' apktool.yml | head -n 1)
          APKTOOL_CODE=$(sed -n 's/^  versionCode: *//p' apktool.yml | head -n 1)
          MANIFEST_VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -n 1)
          MANIFEST_CODE=$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -n 1)
          if [[ -z "$APKTOOL_VERSION" || -z "$APKTOOL_CODE" || "$APKTOOL_VERSION" != "$MANIFEST_VERSION" || "$APKTOOL_CODE" != "$MANIFEST_CODE" ]]; then
            echo "apktool.yml and AndroidManifest.xml must contain the same version code and name"
            exit 1
          fi

          APK_NAME="streamhub-${MANIFEST_VERSION}.apk"
          cp "${signed_apks[0]}" "$APK_NAME"
          unzip -t "$APK_NAME" >/dev/null
          java -jar tools/apktool.jar d -f -s "$APK_NAME" -o build/signed-check --no-src
          DECODED_VERSION=$(sed -n 's/^  versionName: *//p' build/signed-check/apktool.yml | head -n 1)
          DECODED_CODE=$(sed -n 's/^  versionCode: *//p' build/signed-check/apktool.yml | head -n 1)
          if [[ "$DECODED_VERSION" != "$MANIFEST_VERSION" || "$DECODED_CODE" != "$MANIFEST_CODE" ]]; then
            echo "Signed APK metadata does not match AndroidManifest.xml"
            exit 1
          fi

          python3 - "$APK_NAME" build/signed-check/AndroidManifest.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          apk, manifest_path = sys.argv[1:]
          with zipfile.ZipFile(apk) as archive:
              entries = set(archive.namelist())
              required = {"AndroidManifest.xml", "classes.dex"}
              missing = required - entries
              if missing:
                  raise SystemExit(f"APK is missing required entries: {sorted(missing)}")
              native_abis = sorted({
                  name.split("/")[1]
                  for name in entries
                  if name.startswith("lib/") and name.endswith(".so")
              })
              if not native_abis:
                  raise SystemExit("APK contains no native libraries")
              required_abis = {"arm64-v8a", "armeabi-v7a"}
              missing_abis = required_abis - set(native_abis)
              if missing_abis:
                  raise SystemExit(f"APK is missing Fire TV/Android ARM ABIs: {sorted(missing_abis)}")
              print(f"Validated {apk}; native ABIs: {', '.join(native_abis)}")

          android = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse(manifest_path).getroot()
          app = manifest.find("application")
          if app is None:
              raise SystemExit("APK manifest has no application")

          phone_launcher = False
          tv_launcher = False
          for activity in app.findall("activity"):
              if activity.get(android + "name") != "org.clipbox.player.ui.ServerGateActivity":
                  continue
              for intent_filter in activity.findall("intent-filter"):
                  actions = {node.get(android + "name") for node in intent_filter.findall("action")}
                  categories = {node.get(android + "name") for node in intent_filter.findall("category")}
                  if "android.intent.action.MAIN" in actions:
                      phone_launcher |= "android.intent.category.LAUNCHER" in categories
                      tv_launcher |= "android.intent.category.LEANBACK_LAUNCHER" in categories
          if not phone_launcher or not tv_launcher:
              raise SystemExit("APK must expose launcher entries for Android and Android TV")
          print("Validated phone and Android TV launch entries")
          PY

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"
          sha256sum "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-${{ github.run_number }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APK_VERSION }}-streamhub
          name: StreamHub ${{ env.APK_VERSION }}
          body: |
            APK compiled from the StreamHub Lab sources and signed for installation.
            The package keeps the ClipBox-inspired TV interface and uses StreamHub providers.
          files: ${{ env.APK_NAME }}
          overwrite_files: true

      - name: Publish requested version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: StreamHub ${{ github.ref_name }}
          files: ${{ env.APK_NAME }}
          overwrite_files: true
