name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup build tools
        run: |
          mkdir -p tools
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o tools/apktool.jar || \
          curl -sL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_3.0.3.jar -o tools/apktool.jar
          curl -sL https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o tools/uber-apk-signer.jar

      - name: Build APK with Apktool
        run: |
          java -jar tools/apktool.jar b . -o app-unsigned.apk

      - name: Align and Sign APK
        run: |
          java -jar tools/uber-apk-signer.jar -a app-unsigned.apk -o out

      - name: Prepare Release Artifacts
        run: |
          SIGNED_APK=$(find out -name "*.apk" | head -n 1)
          cp "$SIGNED_APK" streamhub-clipbox-v1.0.7.apk
          ls -la streamhub-clipbox-v1.0.7.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-clipbox-apk
          path: streamhub-clipbox-v1.0.7.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.7-clipbox
          name: StreamHub ClipBox v1.0.7
          body: |
            StreamHub reconstructed with ClipBox TV/Mobile skeleton and optimized video servers:
            - TMDb English & Global servers (VixSrc, VidLink, TwoEmbed, VidsrcNet, VidsrcRu, Vidflix, Moviesapi, Vidrock, Vidzee, PrimeSrc, Videasy)
            - Spanish fallback routed directly to fast multi-server pipeline
            - Built and signed with APKTool 3.0.3 & uber-apk-signer
          files: streamhub-clipbox-v1.0.7.apk
