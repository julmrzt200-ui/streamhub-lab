name: Harvest Subtitles (TheFlixBay / VidLink)

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: 'Página inicial (0 para continuar automáticamente según progreso guardado)'
        required: false
        default: '0'
      max_pages:
        description: 'Cantidad de páginas a procesar (ej. 5, 10, o 0 para todas las posibles)'
        required: false
        default: '5'
      target_tag:
        description: 'Categoría de TheFlixBay (ej. reality-tv)'
        required: false
        default: 'reality-tv'

permissions:
  contents: write

jobs:
  harvest:
    name: Harvest Subtitles (${{ github.event.inputs.target_tag || 'reality-tv' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'tools/subtitles_harvest/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/subtitles_harvest/requirements.txt

      - name: Run Subtitle Harvester
        env:
          START_PAGE: ${{ github.event.inputs.start_page || '0' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          TARGET_TAG: ${{ github.event.inputs.target_tag || 'reality-tv' }}
        run: |
          python tools/subtitles_harvest/harvest.py \
            --start-page "$START_PAGE" \
            --max-pages "$MAX_PAGES" \
            --tag "$TARGET_TAG" \
            --output-dir "./subtitles_data/theflixbay"

      - name: Commit and push harvested subtitles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subtitles_data/
          if git diff --staged --quiet; then
            echo "No se generaron subtítulos nuevos para commitear."
          else
            git commit -m "chore(subtitles): harvest progress [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
